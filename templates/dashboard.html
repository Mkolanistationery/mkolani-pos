{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <h2 class="fw-bold">Dashboard - {{ current_user.business_name }}</h2>
        <p class="text-muted">Karibu kwenye mfumo wako wa Mkolani POS.</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
            <h5>Mauzo</h5>
            <a href="{{ url_for('sales') }}" class="btn btn-primary btn-sm mt-2">Fungua Mauzo</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
            <h5>Bidhaa</h5>
            <a href="{{ url_for('products') }}" class="btn btn-primary btn-sm mt-2">Simamia Bidhaa</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
            <h5>Madeni</h5>
            <a href="{{ url_for('debts') }}" class="btn btn-primary btn-sm mt-2">Orodha ya Madeni</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3">
            <h5>SMS Center</h5>
            <a href="{{ url_for('sms_center') }}" class="btn btn-primary btn-sm mt-2">Tuma SMS</a>
        </div>
    </div>
</div>
{% endblock %}
