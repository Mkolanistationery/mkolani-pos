{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>📱 Mkolani SMS Center</h2><span class="badge bg-dark fs-6">Balance: {{wallet.balance if wallet else 0}} SMS</span></div><div class="row g-4"><div class="col-lg-5"><div class="card panel-card"><div class="card-header"><b>Send SMS / Bulk SMS</b></div><div class="card-body"><form method="post"><label>Recipients</label><textarea class="form-control mb-2" name="recipients" placeholder="0712..., 0754..., 0622..." required></textarea><label>Message</label><textarea class="form-control mb-2" name="message" rows="6" required></textarea><button class="btn btn-primary w-100">Send via Beem</button></form></div></div><div class="card panel-card mt-3"><div class="card-header"><b>Templates</b></div><div class="card-body"><form method="post" action="{{url_for('add_sms_template')}}"><input class="form-control mb-2" name="name" placeholder="Template name" required><textarea class="form-control mb-2" name="message" placeholder="Message" required></textarea><button class="btn btn-outline-primary">Save Template</button></form></div></div></div><div class="col-lg-7"><div class="card panel-card"><div class="card-header"><b>SMS History</b></div><div class="table-responsive"><table class="table"><thead><tr><th>Recipient</th><th>Status</th><th>Sender</th><th>Date</th></tr></thead><tbody>{% for m in messages %}<tr><td>{{m.recipient}}</td><td><span class="badge {% if m.status=='sent' %}bg-success{% elif m.status=='failed' %}bg-danger{% else %}bg-warning{% endif %}">{{m.status}}</span></td><td>{{m.sender_id}}</td><td>{{m.created_at}}</td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
