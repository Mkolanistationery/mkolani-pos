{% extends "base.html" %}{% block title %}Login | Mkolani POS{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card">
<div class="brand-circle"><i class="bi bi-shop"></i></div><h2>Mkolani POS</h2><p class="text-muted">Business Management System</p>
{% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}{% if success %}<div class="alert alert-success">{{success}}</div>{% endif %}
<form method="post"><label>Email</label><input class="form-control mb-3" type="email" name="email" required>
<label>Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100 py-2">Ingia</button></form>
<div class="d-flex justify-content-between mt-3 small"><a href="{{url_for('forgot_password')}}">Umesahau password?</a><a href="{{url_for('register')}}">Fungua account</a></div>
</div></div>{% endblock %}
