{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Inventory & Stock</h2></div><div class="row g-4"><div class="col-lg-4"><div class="card panel-card"><div class="card-header"><b>Add Product</b></div><div class="card-body"><form method="post"><input class="form-control mb-2" name="name" placeholder="Product name" required><input class="form-control mb-2" name="sku" placeholder="SKU"><input class="form-control mb-2" name="category" placeholder="Category"><input class="form-control mb-2" name="unit" value="pcs"><div class="row g-2"><div class="col-6"><input class="form-control" name="cost_price" type="number" step=".01" placeholder="Cost"></div><div class="col-6"><input class="form-control" name="selling_price" type="number" step=".01" placeholder="Selling"></div><div class="col-6"><input class="form-control" name="stock_qty" type="number" step=".01" placeholder="Stock"></div><div class="col-6"><input class="form-control" name="reorder_level" type="number" step=".01" value="5"></div></div><button class="btn btn-primary w-100 mt-3">Save Product</button></form></div></div></div><div class="col-lg-8"><div class="card panel-card"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>SKU</th><th>Cost</th><th>Sell</th><th>Stock</th><th>Adjust</th></tr></thead><tbody>{% for p in products %}<tr><td><b>{{p.name}}</b><br><small>{{p.category}}</small></td><td>{{p.sku}}</td><td>{{'{:,.0f}'.format(p.cost_price)}}</td><td>{{'{:,.0f}'.format(p.selling_price)}}</td><td><span class="badge {% if p.stock_qty<=p.reorder_level %}bg-danger{% else %}bg-success{% endif %}">{{p.stock_qty}} {{p.unit}}</span></td><td><form method="post" action="{{url_for('stock_adjust',product_id=p.id)}}" class="d-flex gap-1"><input class="form-control form-control-sm" name="quantity" type="number" step=".01" placeholder="Qty"><select class="form-select form-select-sm" name="movement_type"><option value="in">IN</option><option value="out">OUT</option></select><button class="btn btn-sm btn-dark">OK</button></form></td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
