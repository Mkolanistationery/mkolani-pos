{% extends "base.html" %}{% block content %}<div class="row g-4"><div class="col-lg-7"><div class="card panel-card"><div class="card-header"><b>Business Settings</b></div><div class="card-body"><form method="post" enctype="multipart/form-data"><div class="row g-3"><div class="col-md-6"><label>Business Name</label><input class="form-control" name="business_name" value="{{user.business_name}}"></div><div class="col-md-6"><label>Type</label><input class="form-control" name="business_type" value="{{user.business_type}}"></div><div class="col-md-6"><label>Currency</label><input class="form-control" name="currency" value="{{user.currency}}"></div><div class="col-md-6"><label>Logo</label><input class="form-control" type="file" name="logo" accept="image/*"></div></div><hr><h5>Beem SMS / White Reseller</h5><div class="row g-3"><div class="col-md-6"><label>API Key</label><input class="form-control" name="beem_api_key" value="{{user.beem_api_key or ''}}"></div><div class="col-md-6"><label>Secret Key</label><input class="form-control" type="password" name="beem_secret_key" value="{{user.beem_secret_key or ''}}"></div><div class="col-md-6"><label>Sender ID</label><input class="form-control" name="beem_sender_id" value="{{user.beem_sender_id or ''}}"></div></div><button class="btn btn-primary mt-4">Save Settings</button></form></div></div></div><div class="col-lg-5"><div class="card panel-card"><div class="card-body text-center">{% if user.logo_path %}<img src="{{url_for('static',filename=user.logo_path)}}" class="profile-logo">{% else %}<div class="logo-placeholder"><i class="bi bi-shop"></i></div>{% endif %}<h4 class="mt-3">{{user.business_name}}</h4><p class="text-muted">{{user.email}} · {{user.role}}</p></div></div></div></div>{% endblock %}
