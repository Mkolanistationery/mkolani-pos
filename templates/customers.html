{% extends "base.html" %}{% block content %}<div class="row g-4"><div class="col-lg-4"><div class="card panel-card"><div class="card-header"><b>Ongeza Mteja</b></div><div class="card-body"><form method="post"><input class="form-control mb-2" name="name" placeholder="Jina" required><input class="form-control mb-2" name="phone" placeholder="Simu"><input class="form-control mb-2" name="email" placeholder="Email"><input class="form-control mb-2" name="address" placeholder="Address"><textarea class="form-control mb-2" name="notes" placeholder="Notes"></textarea><button class="btn btn-primary w-100">Save</button></form></div></div></div><div class="col-lg-8"><div class="card panel-card"><div class="card-header"><b>Customer CRM</b></div><div class="table-responsive"><table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Purchases</th><th>Debt</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{'{:,.0f}'.format(c.purchases)}}</td><td class="{% if c.debt>0 %}text-danger fw-bold{% endif %}">{{'{:,.0f}'.format(c.debt)}}</td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
